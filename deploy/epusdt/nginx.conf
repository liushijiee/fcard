server {
    listen 8080;
    server_name _;
    client_max_body_size 16k;

    location ^~ /pay/switch-network { return 403; }
    location ^~ /payments/epay { return 403; }
    location ^~ /payments/okpay { return 403; }
    location ^~ /api/install { return 403; }

    location / {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
